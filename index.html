<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCHOOL SAAS V3 CLOUD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>:root{--green:#0f5d2f;--gold:#f7c948}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f8fbf8}.header{background:var(--green);color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;margin:12px}.btn{border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700}.btn-green{background:var(--green);color:#fff}.btn-gold{background:var(--gold);color:#222}input,select{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;margin:4px 0}table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--green);color:#fff;padding:8px}td{padding:6px;border-bottom:1px solid #eee}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}</style>
</head><body>
<div class="header"><h1 style="margin:0;font-size:18px">🏫 SCHOOL SAAS V3<small id="schoolLabel" style="display:block;font-weight:400;font-size:12px">Loading...</small></h1><select id="schoolSelect" style="width:200px" onchange="switchSchool()"></select></div>
<div class="card grid2"><div><h3>Add New School</h3><input id="newSchoolName" placeholder="School Name"><input id="newSchoolPO" placeholder="P.O. Box"><button class="btn btn-gold" onclick="addSchool()">+ Add School</button></div><div><h3 id="stats">Stats</h3><button class="btn btn-green" onclick="exportExcel()">⬇️ Export Excel</button></div></div>
<div class="card"><h3>📥 Add Marks (Cloud Saved)</h3><div class="grid2"><input id="adm" placeholder="ADM"><input id="sname" placeholder="Student Name"><select id="grade"><option>G7</option><option>G8</option><option>G9</option></select><select id="term"><option>Term 1</option><option>Term 2</option><option selected>Term 3</option></select></div>
<div class="grid2"><input type="number" id="eng" placeholder="ENG"><input type="number" id="kis" placeholder="KIS"><input type="number" id="mat" placeholder="MAT"><input type="number" id="intsci" placeholder="INT SCI"><input type="number" id="sst" placeholder="SST"><input type="number" id="agri" placeholder="AGRI"><input type="number" id="pretech" placeholder="PRE-TECH"><input type="number" id="cre" placeholder="CRE"><input type="number" id="creative" placeholder="CREATIVE"></div>
<div class="grid2"><select id="examType"><option>Opener Exams</option><option>Mid Term Exams</option><option selected>End Term Exams</option></select><button class="btn btn-green" onclick="saveStudent()">💾 Save to Cloud</button></div>
<div><input type="file" id="bulkFile" accept=".xlsx,.csv"><button class="btn btn-gold" onclick="bulkUpload()">📤 Bulk Upload</button></div></div>
<div class="card"><input id="searchBox" placeholder="Search name or ADM..." oninput="renderTable()"><div style="overflow:auto;max-height:60vh;margin-top:10px"><table><thead><tr><th>ADM</th><th>Name</th><th>Grade</th><th>Total</th><th>Mean</th><th>CBC</th><th>Del</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<script>
const SUPABASE_URL="https://bqwnwsvgmgdnqtwrrpbc.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxd253c3ZnbWdkbnF0d3JycGJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNDA0MDksImV4cCI6MjEwNzYxNjQwOX0.KzTfdJVba0uc8I-tIb2B8z37U7yhS-riQnCU9TdWKbI";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let currentSchoolId=null, allStudents=[];
async function init(){await loadSchools();}
async function loadSchools(){const {data}=await sb.from('schools').select('*').order('name');const sel=document.getElementById('schoolSelect');sel.innerHTML='';data.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name;sel.appendChild(o);});if(data.length>0){currentSchoolId=data[0].id;sel.value=currentSchoolId;switchSchool();}}
function switchSchool(){const sel=document.getElementById('schoolSelect');currentSchoolId=sel.value;document.getElementById('schoolLabel').textContent=sel.options[sel.selectedIndex].text+" | CLOUD SAAS";loadStudents();}
async function loadStudents(){if(!currentSchoolId)return;const {data}=await sb.from('students').select('*').eq('school_id',currentSchoolId).order('adm');allStudents=data||[];document.getElementById('stats').innerHTML="<b>Students:</b> "+allStudents.length;renderTable();}
function calcCBC(total){const mean=Math.round(total/9);let g='BE';if(mean>=80)g='EE1';else if(mean>=65)g='EE2';else if(mean>=50)g='ME1';else if(mean>=35)g='ME2';else if(mean>=20)g='AE1';return{mean,grade:g};}
async function saveStudent(){const adm=document.getElementById('adm').value.trim(),name=document.getElementById('sname').value.trim().toUpperCase();if(!adm||!name)return alert('ADM & Name required');const eng=+document.getElementById('eng').value||0,kis=+document.getElementById('kis').value||0,mat=+document.getElementById('mat').value||0,intSci=+document.getElementById('intsci').value||0,sst=+document.getElementById('sst').value||0,agri=+document.getElementById('agri').value||0,preTech=+document.getElementById('pretech').value||0,cre=+document.getElementById('cre').value||0,creative=+document.getElementById('creative').value||0,total=eng+kis+mat+intSci+sst+agri+preTech+cre+creative;const {mean,grade:cbc}=calcCBC(total);const payload={school_id:currentSchoolId,adm,name,grade:document.getElementById('grade').value,eng,kis,mat,intSci,sst,agri,preTech,cre,creative,total,mean,cbc,term:document.getElementById('term').value,exam_type:document.getElementById('examType').value,year:'2026'};const {error}=await sb.from('students').upsert(payload,{onConflict:'school_id,adm'});if(error)alert(error.message);else{alert('Saved! '+name);loadStudents();}}
function renderTable(){const q=document.getElementById('searchBox').value.toLowerCase(),tbody=document.getElementById('tbody');tbody.innerHTML='';allStudents.filter(s=>s.name.toLowerCase().includes(q)||s.adm.toLowerCase().includes(q)).forEach(s=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${s.adm}</td><td>${s.name}</td><td>${s.grade}</td><td>${s.total}</td><td>${s.mean}</td><td>${s.cbc}</td><td><button onclick="deleteStudent('${s.id}')">❌</button></td>`;tbody.appendChild(tr);});}
async function deleteStudent(id){if(!confirm('Delete?'))return;await sb.from('students').delete().eq('id',id);loadStudents();}
async function addSchool(){const name=document.getElementById('newSchoolName').value.trim().toUpperCase(),po=document.getElementById('newSchoolPO').value.trim();if(!name)return alert('Name required');const {error}=await sb.from('schools').insert({name,po_box:po});if(error)alert(error.message);else{alert('Added '+name);loadSchools();}}
function exportExcel(){const ws=XLSX.utils.json_to_sheet(allStudents),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Students");XLSX.writeFile(wb,"KABUABUA_"+Date.now()+".xlsx");}
async function bulkUpload(){const file=document.getElementById('bulkFile').files[0];if(!file)return alert('Select file');const reader=new FileReader();reader.onload=async(e)=>{const wb=XLSX.read(e.target.result,{type:'binary'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);for(const r of rows){const adm=String(r.ADM||r.adm||'').trim(),name=String(r.Name||r.NAME||'').trim().toUpperCase();if(!adm||!name)continue;const eng=+r.ENG||0,kis=+r.KIS||0,mat=+r.MAT||0,intSci=+r.INTSCI||r['INT SCI']||0,sst=+r.SST||0,agri=+r.AGRI||0,preTech=+r.PRETECH||r['PRE-TECH']||0,cre=+r.CRE||0,creative=+r.CREATIVE||0,total=eng+kis+mat+intSci+sst+agri+preTech+cre+creative;const {mean,grade:cbc}=calcCBC(total);await sb.from('students').upsert({school_id:currentSchoolId,adm,name,grade:r.Grade||'G7',eng,kis,mat,intSci,sst,agri,preTech,cre,creative,total,mean,cbc,term:'Term 3',exam_type:'End Term Exams',year:'2026'},{onConflict:'school_id,adm'});}alert('Bulk done');loadStudents();};reader.readAsBinaryString(file);}
init();
</script></body></html>
